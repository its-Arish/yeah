name: Build episodes

# Push a change to any episodes/<name>/episode.txt and GitHub renders the stems (video, music, sfx, captions, markers).
# Download it from the run's "Artifacts" section. You can also run it by hand from the Actions tab.
on:
  push:
    paths: ['episodes/**', 'renderer/**', 'audio.py', 'render.py', 'make_timeline.py']
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode folder name (blank = all)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pick episodes
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            list="episodes/${{ github.event.inputs.episode }}/episode.txt"
          elif [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^episodes/' && ! git diff --name-only HEAD~1 HEAD | grep -qv '^episodes/'; then
            list=$(git diff --name-only HEAD~1 HEAD | grep '^episodes/.*/episode.txt$' | sort -u | tr '\n' ' ')
          else
            list=$(ls episodes/*/episode.txt | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          for ep in ${{ steps.pick.outputs.list }}; do ./build.sh "$ep"; done
      - uses: actions/upload-artifact@v4
        with:
          name: episode-stems
          path: |
            out/*/*.mp4
            out/*/*.wav
            out/*/*.srt
            out/*/*.csv
            out/*/*.json
          if-no-files-found: warn
